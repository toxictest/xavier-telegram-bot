services:
  - type: web
    name: xavier-telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python webhook_bot.py
    healthCheckPath: /health

  - type: web
    name: xavier-whatsapp-bot
    runtime: node
    plan: free
    rootDirectory: wa
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
